<!doctype html>
<html>
  <head>
  
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
     <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <!--Let browser know website is optimized for mobile-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{% block title %}{% endblock %}</title>

  </head>
  <body>
    <div class="container">
      <div class="row" style="margin-top: 10%;">
        <div class="col s12 m10 offset-m1">
          <div class="card-content">
            <form method="POST" action="/login" style="display: flex; flex-wrap: nowrap; align-items: center; margin-right: 10px;">
              <div style="margin-right: 10px;">
                  <input placeholder="username" value="bob" name="username" type="text" required>
                  <label for="username">username</label>
              </div>
              <div style="margin-right: 10px;">
                  <input placeholder="password"value="bobpass" name="password" type="password" required>
                  <label for="password">Password</label>
              </div>
              <button type="submit" class="btn waves-effect waves-light">Login</button>
              <a href="/register" class="btn waves-effect waves-light" type="button">Sign Up</a>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script>
       M.AutoInit();

        {% with messages = get_flashed_messages() %}
          {% if messages %}
              {% for message in messages %}
              M.toast({html: '{{message}}'})
              {% endfor %}
          {% endif %}
        {% endwith %}
       
    </script>
    
  </body>
</html>
