<!doctype html>
<html>
  <head>
  
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
     <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <!--Let browser know website is optimized for mobile-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{% block title %}{% endblock %}</title>

  </head>
  <body>
    {% for ingredient in ingredients %}
        <div class="container" style="margin-top: 10%;"> 
            <div class="row">
                <div class="col s12 m10 offset-m1">
                    <img src="https://img.spoonacular.com/ingredients_100x100/{{ingredient.image}}">
                    <form action="/addIngredient/{{ingredient.id}}" method="POST">
                        <input type="text" name="ingredient_amount">
                        <button type="submit" class="btn waves-effect waves-light">Add to my ingredients</button>
                    </form>
                </div>
            </div>
        </div>
    {% endfor %}
    

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script>
       M.AutoInit();

        {% with messages = get_flashed_messages() %}
          {% if messages %}
              {% for message in messages %}
              M.toast({html: '{{message}}'})
              {% endfor %}
          {% endif %}
        {% endwith %}
       
    </script>
    
  </body>
</html>
